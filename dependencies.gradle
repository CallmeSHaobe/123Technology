
elytraModpackVersion {
    // 在这配置的gtnh版本 用于自动拉取依赖版本
    gtnhVersion = "2.9.0"
    // 是否不缓存拉取的依赖清单文件
    manifestNoCache = false
    // 是否自动为输出的jar添加 `gtnhVersion` 后缀
    attachManifestVersionToJar = false
}

// TST：GitHub releases 的 dev jar 拉到 libs/（已被 .gitignore 忽略），首次编译前自动下载。
// 0.8.1 的 Bottled Chaos 需要没人注册的 mutagen 流体，进存档会 NPE，dev 先钉 0.8.0。
def tstVersion = (project.findProperty('tstVersion') ?: '0.8.0').toString()
def tstJar = file("libs/TwistSpaceTechnology-${tstVersion}-dev.jar")
def tstReleaseUrl = "https://github.com/Nxer/Twist-Space-Technology-Mod/releases/download/${tstVersion}/${tstJar.name}"

tasks.register('downloadTwistSpaceTechnology') {
    group = 'dependencies'
    description = "下载 TST ${tstVersion} 的 dev jar 到 libs/（GitHub releases，无 maven 坐标）"
    outputs.file(tstJar)
    doLast {
        if (tstJar.exists()) return
        tstJar.parentFile.mkdirs()
        logger.lifecycle("TST: downloading ${tstReleaseUrl}")
        ant.get(src: tstReleaseUrl, dest: tstJar, skipexisting: true, verbose: true)
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn 'downloadTwistSpaceTechnology'
}

dependencies {
    implementation(gtnhDev("GT5-Unofficial"))
    compileOnly(gtnhDev("CropsNH"))
    implementation(gtnhDev("NewHorizonsCoreMod"))
    implementation('com.github.GTNewHorizons:Mobs-Info:0.6.0-GTNH:dev')
    implementation(gtnhDev("Infernal-Mobs"))
    implementation(gtnhDev("Galaxy-Space-GTNH"))
    implementation(gtnhDev("SGCraft"))
    implementation(gtnhDev("twilightforest"))
    implementation(gtnhDev("AE2FluidCraft-Rework"))
    implementation(gtnhDev("Avaritia"))
    implementation(gtnhDev("Avaritiaddons"))
    implementation(gtnhDev("neiaddons"))
    implementation(gtnhDev("Binnie"))
    implementation(gtnhDev("BloodMagic"))
    implementation(gtnhDev("Botania"))
    implementation(gtnhDev("Draconic-Evolution"))
    implementation(gtnhDev("EnderIO"))
    implementation(gtnhDev("Eternal-Singularity"))
    implementation(gtnhDev("ForestryMC"))
    implementation(gtnhDev("MagicBees"))
    implementation(gtnhDev("NotEnoughItems"))
    implementation(gtnhDev("OpenComputers"))
    implementation(gtnhDev("ThaumicEnergistics"))
    implementation(gtnhDev("Universal-Singularities"))
    implementation(gtnhDev("BetterQuesting"))
    implementation(gtnhDev("supersolarpanels"))
    implementation(rfg.deobf('curse.maven:advsolar-362768:2885953'))
    implementation ("net.industrial-craft:industrialcraft-2:2.2.828-experimental:dev")
    runtimeOnlyNonPublishable(rfg.deobf("curse.maven:BiomesOPlenty-220318:2499612"))
    implementation(deobfCurse('witchery-69673:2234410'))
    implementation(gtnhDev("WitcheryExtras"))

    implementation("thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev")
    implementation('com.github.GTNewHorizons:worldedit-gtnh:v0.0.8:dev')
    compileOnly(rfg.deobf("maven.modrinth:journeymap:5.2.23"))
    compileOnly(gtnhDev("VisualProspecting"))
    compileOnly(files(tstJar))
    runtimeOnlyNonPublishable(files(tstJar))
    runtimeOnlyNonPublishable(gtnhDev("Electro-Magic-Tools")) {
        exclude group: 'curse.maven', module: 'thaumcraft-nei-plugin-225095'
    }
    runtimeOnlyNonPublishable(gtnhDev("CropsNH"))
    runtimeOnlyNonPublishable(gtnhDev("BetterBuildersWands"))
    runtimeOnlyNonPublishable(gtnhDev("AspectRecipeIndex"))
    runtimeOnlyNonPublishable(rfg.deobf('curse.maven:thaumcraft-nei-plugin-225095:2241913'))


    // runtime
    runtimeOnlyNonPublishable(gtnhDev("BetterP2P"))
    runtimeOnlyNonPublishable(gtnhDev("Chisel")) { transitive = false }
    runtimeOnlyNonPublishable(gtnhDev("StructureLib"))
    runtimeOnlyNonPublishable(gtnhDev("BlockRenderer6343")) { transitive = false }
    runtimeOnlyNonPublishable('com.github.GTNewHorizons:Railcraft:9.17.34:dev') { transitive = false }

    annotationProcessor('com.google.auto.value:auto-value:1.10.1')
    implementation('com.google.auto.value:auto-value-annotations:1.10.1')

    // jvmDowngrader
    compileOnly("javax.xml.bind:jaxb-api:2.3.1")
    compileOnly("org.jetbrains:annotations:26.0.1")
    compileOnly("org.projectlombok:lombok:1.18.42") { transitive = false }
    annotationProcessor("org.projectlombok:lombok:1.18.42")


    configurations.configureEach {
        exclude group: 'com.github.GTNewHorizons', module: 'Baubles'
    }

    configurations.all {
        resolutionStrategy {
            force "com.github.GTNewHorizons:GTNHLib:0.11.54"
        }
    }

}

@SuppressWarnings('GrMethodMayBeStatic')
String gtnhDev(String name, String classifier = "dev") {
    return elytraModpackVersion.gtnh(name, classifier)
}

